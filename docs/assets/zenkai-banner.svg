      <path d="m212 86 6 6 11-13" fill="none" stroke="#153528" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="4" y="160" fill="#bed0c1" font-size="13" letter-spacing="2.4">EVIDENCE TO RECOVERY</text>
