<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Zenkai — verified recovery</title>
  <desc id="description">Detect the break. Understand the cause. Verify the comeback. A signal flows toward a verified recovery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10271f" />
      <stop offset="1" stop-color="#214c3b" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c8e5b2" stroke-opacity="0.06" />
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />
  <circle cx="1110" cy="20" r="235" fill="#c8e5b2" opacity="0.035" />
  <circle cx="1110" cy="20" r="170" fill="none" stroke="#c8e5b2" stroke-opacity="0.1" />
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="48" width="54" height="54" rx="14" fill="#c8e5b2" />
    <path d="M66 64H92L67 87H93" fill="none" stroke="#153528" stroke-width="6" stroke-linejoin="round" />
    <text x="126" y="89" fill="#f6f8ee" font-size="44" font-weight="700" letter-spacing="-1.4">Zenkai<tspan fill="#c8e5b2">.</tspan></text>
    <text x="54" y="155" fill="#f6f8ee" font-size="31" font-weight="700" letter-spacing="-0.6">Detect the break. Understand the cause.</text>
    <text x="54" y="197" fill="#c8e5b2" font-size="31" font-weight="700" letter-spacing="-0.6">Verify the comeback.</text>
    <text x="54" y="264" fill="#bed0c1" font-size="15" letter-spacing="1.8">AI DIAGNOSIS</text>
    <circle cx="190" cy="259" r="3" fill="#84ab89" />
    <text x="209" y="264" fill="#bed0c1" font-size="15" letter-spacing="1.8">CONTROLLED ACTIONS</text>
    <circle cx="423" cy="259" r="3" fill="#84ab89" />
    <text x="442" y="264" fill="#bed0c1" font-size="15" letter-spacing="1.8">MEASURED RECOVERY</text>
    <g transform="translate(850 100)">
      <path d="M0 86H35L49 49L69 119L93 28L115 86H220" fill="none" stroke="#c8e5b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
