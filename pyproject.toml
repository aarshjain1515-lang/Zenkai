[project]
name = "zenkai"
version = "0.1.0"
description = "Evidence-driven recovery for university infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "sqlalchemy[asyncio]>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "docker>=7.1,<8", "prometheus-client>=0.21,<1", "itsdangerous>=2.2,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/zenkai"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
